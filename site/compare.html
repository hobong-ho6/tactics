<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>선수 비교 — tactics v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/clubviz.css?v=20260924b"></head><body>
<div id="hdr"></div>
<h1>선수 비교 <small class="dim">후보 풀 = 현재 잔류 스쿼드 실측 — 확정 이탈·이적 루머 제외, DB 이력은 보존</small></h1>
<div class="panel">
  <label class="kv">슬롯 <select id="slotSel"></select></label>
  <span class="kv" style="margin-left:14px"><b>비교 범위</b>
    <button class="tab on" data-mode="slot">이 슬롯만</button><button class="tab" data-mode="group">슬롯군(포지션 묶음)</button></span>
  <span class="kv" style="margin-left:14px"><b>기준 시즌</b>
    <button class="tab on" data-season="2025-26">25/26 정본 (전수)</button><button class="tab" data-season="2026-27">26/27 현재</button></span>
  <div id="seasonNote" class="dim" style="font-size:12px;margin-top:6px"></div>
</div>
<div class="panel" id="cmpPanel" hidden></div>
<div class="panel"><h2 id="rankTitle"></h2>
  <p class="dim" style="font-size:12px;margin:0 0 8px">⭐ <b>행을 누르면 비교에 담긴다</b>(둘까지) —
    두 명이 차면 위에 <b>「이 자리가 어떻게 달라지나」</b> 패널이 열린다.</p>
  <table id="rank"></table></div>
<div class="cardrow" id="cards"></div>
<script type="module">
import { mountHeader, loadTeam, loadKernels, loadGameStats, slotCandidates, sofifaLink, statLine, isGkSlot, gkPosCell } from './assets/data.js?v=20260924-ut-rename';
import { Kernel } from './assets/kernel.js?v=20260825-decodemap-null';
import { miniGrid } from './assets/pitch.js?v=20260825-decodemap-null';
import { compareReal } from './assets/realcompare.js?v=20260925a';
const CARDS = await fetch('data/game_stats/cards.json', { cache: 'no-store' }).then(r => r.json()).catch(() => ({}));

const { team, regime } = await mountHeader('compare.html');
const [td, kd, GS] = await Promise.all([loadTeam(team), loadKernels('FC26'), loadGameStats('FC26')]);
const K = new Kernel(kd);
const slots = td.slots.filter(s => s.formation === td.slots[0]?.formation);

/* ⭐ 기준 시즌 축 (2026-09-13 신설, 사용자 지적).
   ⛔ 종전엔 `squad_entries.map25` 하나만 썼는데 그 그리드는 사실상 **25/26 전수 실측**이다
   (rate_note가 「RM 21경기」·「LB 16경기」처럼 지난 시즌 표본을 가리킨다). 화면엔 그 사실이 어디에도 없었다.
   ⇒ 26/27 실측(`prescriptions` season='2026-27' kind='measured')을 **별도 축**으로 고르게 한다.
   ⛔ 두 시즌을 한 랭킹에 섞지 않는다 — 표본 크기·체제가 달라 sim이 같은 척도가 아니다. */
const GRID2627 = new Map();
for (const p of td.prescriptions ?? []){
  if (p.season === '2026-27' && p.kind === 'measured' && p.map25 && p.player_id != null){
    const prev = GRID2627.get(p.player_id);
    if (!prev || (p.sample_n ?? 0) > (prev.sample_n ?? 0)) GRID2627.set(p.player_id, p);
  }
}
/* ⛔ 자리표시 그리드 — `map25`가 25칸 전부 0인 행은 **실측이 아니다**.
   `core/encode.py`는 최대값이 0이면 None을 돌려주므로 전부 0인 문자열은 인코더 산출물일 수 없고,
   실측이 없는 선수 자리를 채워 둔 값이다(현재 ATM 5명). 히트맵처럼 그리면 「데이터가 있는데 비어 있다」로 오독된다.
   ⇒ 랭킹에서 빼고 별도로 열거한다(2026-09-13, 사용자 지적 「히트맵 밑 숫자」 조사 중 발견). */
const isPlaceholderGrid = m => !m || /^0{25}$/.test(m);

/* ⭐⭐ 슬롯군 비교 (2026-09-24 사용자 지시 「슬롯이 포지션으로만 정의되어 있어서 알리송과 가르나초를
   비교할 수 없어 … cdm / 와이드 미드필더 같은 식으로」).
   ⛔ 새 분류를 만들지 않는다 — `slots.slot_type`이 이미 그 묶음이다(GK·CB·FB·DM/CM·WM·CAM·ST).
      좌우가 갈린 자리(LM↔RM · LCB↔RCB · LDM↔RDM)를 한 풀로 합친다.
   ⚠️ 묶음 안에서도 **정본 역할은 자리마다 다르다**(AVL LM=wm_widemid/Support ↔ RM=wm_winger/Attack).
      ⇒ 커널 적합은 **그 선수가 가장 잘 맞는 자리**로 계산하고, 해석도 그 자리의 정본과 견준다. */
let MODE = 'slot';
document.querySelectorAll('button.tab[data-mode]').forEach(b => b.addEventListener('click', () => {
  MODE = b.dataset.mode;
  document.querySelectorAll('button.tab[data-mode]').forEach(x => x.classList.toggle('on', x === b));
  render();
}));

let SEASON = '2025-26';
document.querySelectorAll('button.tab[data-season]').forEach(b => b.addEventListener('click', () => {
  SEASON = b.dataset.season;
  document.querySelectorAll('button.tab[data-season]').forEach(x => x.classList.toggle('on', x === b));
  render();
}));

/* 현재 스쿼드만 비교한다. 이적 후보와 확정 이탈은 DB에 보존하되 여기서는 숨긴다. */
function pool(slot){
  /* 슬롯군이면 같은 `slot_type`의 자리를 전부 합친다 — 같은 선수는 한 번만(먼저 나온 행을 쓴다). */
  const group = MODE === 'group' ? slots.filter(s => s.slot_type === slot.slot_type) : [slot];
  const seen = new Set();
  const base = group.flatMap(s => slotCandidates(td, s.pos, { includeTransfers: false }))
    .filter(q => (seen.has(q.player_id) ? false : (seen.add(q.player_id), true)))
    .map(q => ({
    player_id: q.player_id, label: q.label, map25: q.map25, lh: q.status,
    rate: q.rating, note: q.rate_note, dbFit: q.fit_sim, sourceKind: q.source_kind
  }));
  const groupSlots = group;
  // 자리표시(전부 0) 그리드는 어느 시즌 축에서도 실측으로 세우지 않는다.
  const noGrid = base.filter(c => isPlaceholderGrid(c.map25)).map(c => c.label);
  const real = base.filter(c => !isPlaceholderGrid(c.map25));
  if (SEASON === '2025-26') return { rows: real, missing: [], noGrid, groupSlots };
  // 26/27 축 — 실측 그리드가 있는 선수만 랭킹에 세우고, 없는 선수는 따로 열거한다(조용한 폴백 금지).
  const rows = [], missing = [];
  for (const c of real){
    const g = GRID2627.get(c.player_id);
    if (g) rows.push({ ...c, map25: g.map25, rate: g.avg_rating ?? c.rate, dbFit: g.fit_sim,
                       note: `${g.pos_label ?? ''} ${g.sample_n ?? '—'}경기 (26/27 실측)`.trim() });
    else missing.push(c.label);
  }
  return { rows, missing, noGrid, groupSlots };
}
/* squad_entries.lh='CONFIRMED'는 「이번 창에 확정 영입된 선수」라는 출처 표시다(docs/00 라벨 규약). 이적창이 닫힌 뒤(2026-09-01)에는
   전원 합류가 끝났으므로 「합류확정」이 아니라 「신규」로 읽는다 — 2026-09-09 사용자 지적(스쿼드 동결 후에도 합류확정 배지 잔존). */
const badge = lh => !lh || lh === 'OWNED' ? '<span class="badge own">보유</span>'
  : /^CONFIRMED/.test(lh) ? '<span class="badge hi">신규</span>'
  : /^HIGH/.test(lh) ? `<span class="badge hi">${lh.split(' ')[0]}</span>`
  : `<span class="badge mid">${lh.split(' ')[0]}</span>`;

const selEl = document.getElementById('slotSel');
selEl.innerHTML = slots.map(s => `<option value="${s.pos}">${s.pos} (${s.slot_type}, x=${s.x})</option>`).join('');
selEl.addEventListener('change', render);

/* ⛔ 담긴 선수는 **슬롯이 바뀌어도 유지**한다 — 같은 선수를 다른 슬롯에서 견주는 게 이 화면의 쓸모다.
   ⚠️ 다만 그 슬롯 후보 풀에 없으면 비교를 열지 않는다(적합 sim이 그 슬롯 기준이라야 뜻이 있다). */
const PICK = [];
function renderCompare(rows, slot){
  const box = document.getElementById('cmpPanel');
  const picked = PICK.map(pid => rows.find(r => r.player_id === pid)).filter(Boolean);
  if (picked.length < 2){
    box.hidden = !PICK.length;
    if (PICK.length) box.innerHTML = `<p class="dim">비교에 <b>${PICK.length}명</b> 담김 —
      ${picked.length < PICK.length ? '⚠️ 담긴 선수 중 일부가 이 슬롯 후보가 아니라 제외됐다. ' : ''}한 명 더 담으면 열린다.</p>`;
    return;
  }
  box.hidden = false;
  const canonOf = pos => (td.slot_canon || []).find(c => c.pos === pos) || null;
  box.innerHTML = compareReal(picked[0], picked[1], {
    td, cards: CARDS, miniGrid, seasonKey: SEASON,
    /* 슬롯군이면 두 선수의 **기준 자리가 서로 다를 수 있다** — 각자의 자리·정본을 따로 넘긴다. */
    slot: picked[0].slot ?? slot, slotA: picked[0].slot ?? slot, slotB: picked[1].slot ?? slot,
    groupMode: MODE === 'group', groupLabel: slot.slot_type,
    canonA: canonOf((picked[0].slot ?? slot).pos), canonB: canonOf((picked[1].slot ?? slot).pos),
    profile: td.profile || [],
    manager: regime?.manager_kr || regime?.manager || '감독',
    roleName: id => K.roleName[id] ?? id,
  });
}

function render(){
  const slot = slots.find(s => s.pos === selEl.value) ?? slots[0];
  const gk = isGkSlot(slot.pos);
  const { rows: cands, missing, noGrid, groupSlots } = pool(slot);
  document.getElementById('seasonNote').innerHTML = SEASON === '2025-26'
    ? '기준: <b>25/26 전수 실측</b>(`squad_entries` 그리드) — 표본이 크고 체제가 한 시즌 통째라 <b>정본</b>이다. 26/27 체제 변화는 반영되지 않는다.'
    : `기준: <b>26/27 현재 실측</b>(\`prescriptions\` measured) — <b>⚠️ 표본 2~7경기로 얇다.</b> 시즌 정본이 아니라 <b>현재 경향</b>으로만 읽을 것.`
      + (missing.length ? `<br>⛔ <b>26/27 실측 없음 ${missing.length}명</b>(랭킹에서 제외, 25/26 값으로 대체하지 않았다): ${missing.join(' · ')}` : '');
  if (noGrid.length) document.getElementById('seasonNote').innerHTML +=
    `<br>⛔ <b>실측 그리드 자체가 없는 선수 ${noGrid.length}명</b>(자리표시 값이라 랭킹·히트맵에서 제외): ${noGrid.join(' · ')}`;
  const rows = cands.map(c => {
    /* 슬롯군이면 묶음 안의 자리를 전부 재 보고 **가장 잘 맞는 자리**를 쓴다.
       ⛔ 임의로 대표 자리를 정하지 않는다 — 좌우 자리는 커널 x가 달라 sim이 실제로 갈린다. */
    let best = null;
    for (const s of groupSlots){
      const bf = K.bestFit(c.map25, s.x, s.slot_type);
      if (!best || bf.sim > best.sim) best = { ...bf, slot: s };
    }
    return { ...c, ...best };
  // GK는 적합이 변별하지 못한다(obs#220) — 적합순 랭킹 자체가 성립하지 않으므로 평점순으로 세운다.
  }).sort((a, b) => gk ? (b.rate ?? 0) - (a.rate ?? 0) : b.sim - a.sim);
  const seasonTag = SEASON === '2025-26' ? '25/26 정본' : '26/27 현재';
  const groupTag = MODE === 'group' ? ` · <b>${slot.slot_type}군</b> ${groupSlots.map(s => s.pos).join('·')} 합산` : '';
  document.getElementById('rankTitle').textContent = gk
    ? `${slot.pos} 슬롯 — 평점 랭킹 [${seasonTag}] (${rows.length}명 · GK는 커널 적합이 변별력을 갖지 못해 평균 위치로 대체)`
    : MODE === 'group'
      ? `${slot.slot_type}군 적합 랭킹 [${seasonTag}] (${groupSlots.map(s => s.pos).join(' · ')} 합산 ${rows.length}명 — 각 선수의 「가장 잘 맞는 자리」 기준)`
      : `${slot.pos} 슬롯 적합 랭킹 [${seasonTag}] (커널 x=${slot.x} · ${slot.slot_type}군 ${rows.length}명)`;
  document.getElementById('rank').innerHTML =
    `<tr><th>#</th><th>선수</th>${MODE === 'group' ? '<th>자리</th>' : ''}<th>적합 역할/포커스</th><th>${gk ? '평균 위치' : 'sim'}</th><th>DB값</th><th>평점</th><th>근거</th></tr>` +
    rows.map((r, i) => `<tr data-pid="${r.player_id}"><td>${i+1}</td><td>${r.label} ${badge(r.lh)} ${sofifaLink(r.label, GS)}<br><small>${statLine(r.label, GS)}</small></td>
      ${MODE === 'group' ? `<td><b>${r.slot?.pos ?? ''}</b></td>` : ''}
      <td>${K.roleName[r.role] ?? r.role}/${r.focus}</td>
      <td>${gkPosCell(td, slot.pos, r.player_id) ?? `<b>${r.sim.toFixed(3)}</b>`}</td>
      <td class="dim">${gk ? '' : (r.dbFit != null ? r.dbFit.toFixed(3) : '—')}</td>
      <td>${r.rate ?? '—'}</td><td class="dim">${r.note ?? ''}</td></tr>`).join('');
  /* ⭐ 비교 담기 — 얼티밋팀과 같은 동선(카드/행을 눌러 둘을 담으면 머리 대 머리가 열린다). */
  document.querySelectorAll('#rank tr[data-pid]').forEach(tr => {
    tr.classList.add('rc-pick');
    tr.classList.toggle('on', PICK.includes(Number(tr.dataset.pid)));
    tr.addEventListener('click', () => {
      const pid = Number(tr.dataset.pid);
      const i = PICK.indexOf(pid);
      if (i >= 0) PICK.splice(i, 1); else { PICK.push(pid); if (PICK.length > 2) PICK.shift(); }
      render();
    });
  });
  renderCompare(rows, slot);
  /* ⛔ map25 원문 문자열은 화면에 찍지 않는다(2026-09-13 사용자 지시 — 읽을 필요 없는 내부 인코딩값).
     값 자체는 DB·export JSON에 그대로 있으니 필요하면 거기서 본다. */
  document.getElementById('cards').innerHTML = rows.slice(0, 4).map(r => `
    <div class="pcard"><b>${r.label}</b> <span class="badge mid">${seasonTag}</span><br>${miniGrid(r.map25)}<br>
    <small class="dim">${r.note ?? ''}</small></div>`).join('');
}
render();
</script></body></html>
