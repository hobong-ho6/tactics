<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>경기 분석 — tactics v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css"></head><body>
<div id="hdr"></div>
<h1>경기별 분석 리포트 <small class="dim">한 경기의 실제 히트맵·전체 스탯·전술 변화·FC 구현 판단</small></h1>
<div class="panel report-picker">
  <label class="kv">경기 <select id="matchReportSel" aria-label="경기별 분석 리포트 선택"></select></label>
  <label class="kv">히트맵 <select id="matchPlayerSel" aria-label="경기 히트맵 선수 선택"></select></label>
  <label class="kv">출전자 범위 <select id="heatView" aria-label="히트맵 출전자 범위"><option value="all">전체 출전자</option><option value="starters">선발 11명</option><option value="subs">교체 선수</option></select></label>
  <label class="kv">재현 XI <select id="presetView" aria-label="경기 재현 프리셋 시점"><option value="start">선발 XI</option><option value="final">교체 반영 종료 XI</option></select></label>
</div>
<div id="empty" class="panel dim" hidden>이 팀에는 완료된 경기 분석 리포트가 아직 없습니다.</div>
<main id="report" hidden>
  <div class="panel" id="summary"></div>
  <div class="grid2 match-overview">
    <section class="panel"><h2>실제 경기 히트맵 <small class="dim">선택한 경기만 사용</small></h2>
      <canvas class="pitch" id="matchPitch" width="640" height="860"></canvas>
      <div id="pitchCaption" class="kv"></div></section>
    <section class="panel"><h2>팀 전체 스탯</h2><div class="scrollx"><table id="teamStats"></table></div></section>
  </div>
  <div class="panel" id="gamePreset"></div>
  <div class="panel"><h2>전술 분석</h2><div class="report-grid" id="tactical"></div></div>
  <div class="panel"><h2>선수별 히트맵·역할·전체 스탯</h2><div id="players" class="player-report-list"></div></div>
  <div class="panel"><details class="report-source"><summary>전체 분석 원문·레퍼런스 펼치기</summary>
    <div id="sourceMeta"></div><pre id="markdown"></pre></details></div>
</main>
<script type="module">
import { mountHeader, loadTeam } from './assets/data.js?v=20260813-match-reports';
import { decodeMap } from './assets/kernel.js';
import { drawPitch, drawComposite, drawChip } from './assets/pitch.js';
import { annotate, mountGlossaryTips } from './assets/glossary.js';

const { team } = await mountHeader('match-report.html');
const td = await loadTeam(team);
const reports = (td.match_reports ?? []).filter(r => r.status === 'complete');
const reportSel = document.getElementById('matchReportSel');
const playerSel = document.getElementById('matchPlayerSel');
const heatView = document.getElementById('heatView');
const presetView = document.getElementById('presetView');
const esc = value => String(value ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const present = value => value !== null && value !== undefined && value !== '';
const bullets = value => String(value ?? '').split('|').filter(Boolean)
  .map(x => `<li>${annotate(esc(x))}</li>`).join('');

const statNames = {
  minutes:'출전 시간',rating:'평점',started:'선발',lineup_pos:'라인업 위치',pos_class:'평균위치 분류',
  avg_x:'평균 위치 X',avg_y:'평균 위치 Y',hit_points:'히트맵 포인트',xg:'xG',xa:'xA',
  goals:'골',assists:'도움',shots_total:'슈팅',shots_on:'유효슈팅',key_passes:'키패스',
  pass_acc:'패스 성공',pass_total:'패스 시도',touches:'터치',duels_won:'경합 승',duels_lost:'경합 패',
  tackles:'태클',interceptions:'인터셉트',recoveries:'회수',clearances:'클리어',saves:'선방',
  phase_lead:'리드 시간',phase_level:'동점 시간',phase_trail:'열세 시간'
};
function playerStats(p){
  let extra={}; try { extra=JSON.parse(p.stats_json || '{}'); } catch (_) {}
  const base={minutes:p.minutes,rating:p.rating,started:p.started,lineup_pos:p.lineup_pos,pos_class:p.pos_class,
    avg_x:p.avg_x,avg_y:p.avg_y,hit_points:p.hit_points,xg:p.xg,xa:p.xa,key_passes:p.key_passes,
    duels_won:p.duels_won,duels_lost:p.duels_lost,tackles:p.tackles,interceptions:p.interceptions,
    goals:p.goals,assists:p.assists,touches:p.touches,recoveries:p.recoveries};
  return Object.entries({...extra,...base}).filter(([,v])=>present(v));
}
function statsTable(p){
  const values=new Map(playerStats(p));
  const groups=[
    ['경기 결과',['minutes','rating','started','goals','assists','shots_total','shots_on','xg','xa']],
    ['공격·배급',['key_passes','pass_acc','pass_total','touches']],
    ['수비·경합',['duels_won','duels_lost','tackles','interceptions','recoveries','clearances','saves']],
    ['위치·국면',['lineup_pos','pos_class','avg_x','avg_y','hit_points','phase_lead','phase_level','phase_trail']]
  ];
  const renderValue=(k,v)=>esc(k==='started'?(v?'선발':'교체'):v);
  const rows=[];
  for (const [title,keys] of groups){
    const items=keys.filter(k=>values.has(k)).map(k=>{const v=values.get(k);values.delete(k);return [k,v]});
    if (!items.length) continue;
    for(let i=0;i<items.length;i+=3){
      const chunk=items.slice(i,i+3);
      const pad=3-chunk.length;
      rows.push(`<tr>${i===0?`<th class="stat-group" rowspan="${Math.ceil(items.length/3)}">${title}</th>`:''}`+
        chunk.map(([k,v])=>`<th>${annotate(esc(statNames[k]||k))}</th><td><b>${renderValue(k,v)}</b></td>`).join('')+
        (pad?`<td colspan="${pad*2}"></td>`:'')+'</tr>');
    }
  }
  const rest=[...values.entries()];
  for(let i=0;i<rest.length;i+=3){
    const chunk=rest.slice(i,i+3);
    const pad=3-chunk.length;
    rows.push(`<tr>${i===0?`<th class="stat-group" rowspan="${Math.ceil(rest.length/3)}">기타 원천값</th>`:''}`+
      chunk.map(([k,v])=>`<th>${annotate(esc(statNames[k]||k))}</th><td><b>${renderValue(k,v)}</b></td>`).join('')+
      (pad?`<td colspan="${pad*2}"></td>`:'')+'</tr>');
  }
  return `<div class="scrollx"><table class="player-stats-table">${rows.join('')}</table></div>`;
}
function miniMap(map25){
  if (!map25 || map25.length !== 25) return '<span class="dim">유효 경기 히트맵 없음</span>';
  return `<div class="mini-map" aria-label="5×5 경기 히트맵">${[...map25].map(c => {
    const v=c==='X'?10:Number(c)||0; return `<i style="--heat:${v/10}" title="${v}"></i>`;
  }).join('')}</div>`;
}
function teamStatRows(r){
  const rows = [
    ['포메이션',r.formation_v,r.formation_o],['점유율',r.possession != null ? `${r.possession}%` : null,
      r.possession != null ? `${100-Number(r.possession)}% (파생)` : null],
    ['xG',r.xg_v,r.xg_o],['슈팅',r.shots_v,r.shots_o],['유효슈팅',r.sot_v,r.sot_o],
    ['빅찬스',r.bigch_v,r.bigch_o],['패스',r.passes_v,r.passes_o],
    ['롱볼 성공/시도',present(r.long_acc_v)?`${r.long_acc_v}/${r.long_att_v}`:null,present(r.long_acc_o)?`${r.long_acc_o}/${r.long_att_o}`:null],
    ['크로스 성공/시도',present(r.cross_acc_v)?`${r.cross_acc_v}/${r.cross_att_v}`:null,null],
    ['코너킥',r.corners_v,r.corners_o],['경합 승률',present(r.duelpct_v)?`${r.duelpct_v}%`:null,null],
    ['파울',r.fouls_v,r.fouls_o]
  ];
  return `<tr><th>지표</th><th>${esc(td.regime.team_kr)}</th><th>${esc(r.opponent)}</th></tr>`+
    rows.map(([name,a,b])=>`<tr><td>${annotate(esc(name))}</td><td><b>${esc(present(a)?a:'미수집')}</b></td><td>${esc(present(b)?b:'미수집')}</td></tr>`).join('');
}
function renderPitch(r){
  const cv=document.getElementById('matchPitch'),ctx=cv.getContext('2d'); drawPitch(ctx,cv.width,cv.height);
  const requested=playerSel.value;
  const pool=heatView.value==='starters' ? r.players.filter(p=>p.started) :
    (heatView.value==='subs' ? r.players.filter(p=>!p.started) : r.players);
  const picked=requested ? r.players.filter(p=>String(p.player_id)===requested) : pool;
  const maps=picked.map(p=>decodeMap(p.map25)).filter(Boolean); drawComposite(ctx,cv.width,cv.height,maps);
  for (const p of picked){
    if (!present(p.avg_x)||!present(p.avg_y)) continue;
    drawChip(ctx,cv.width,cv.height,100-Number(p.avg_y),Number(p.avg_x),p.label);
  }
  document.getElementById('pitchCaption').innerHTML = requested
    ? annotate(`<b>${esc(picked[0]?.label)}</b> · ${picked[0]?.started?'선발':'교체'} · 이 경기 ${esc(picked[0]?.minutes ?? '—')}분 · 히트포인트 ${esc(picked[0]?.hit_points ?? '—')}`)
    : annotate(`<b>${heatView.value==='starters'?'선발 합성':heatView.value==='subs'?'교체 합성':'전체 출전자 합성'}</b> · 유효 히트맵 ${maps.length}/${picked.length}명 · <b>이름 칩 = 해당 경기 실제 평균 위치</b>`);
}
function renderGamePreset(r){
  const s=r.game_setup, all=r.game_players??[];
  const el=document.getElementById('gamePreset');
  if (!s){el.innerHTML='<h2>이 경기 FC 재현 프리셋</h2><p class="dim">아직 작성되지 않았습니다.</p>';return;}
  const subs=all.filter(p=>!p.starter);
  const replaced=new Set(subs.map(p=>p.replaced_player_id).filter(Boolean));
  const starters=all.filter(p=>p.starter);
  const players=presetView.value==='final' ? starters.filter(p=>!replaced.has(p.player_id)).concat(subs) : starters;
  const phase=presetView.value==='final'?'교체 반영 종료 XI':'선발 XI';
  el.innerHTML=`<div class="match-report-head"><div><h2>이 경기만의 ${esc(s.game_version)} 재현 프리셋</h2>
    <p class="kv">시즌 정본과 분리된 단일 경기 설정입니다. 현재 <b>${phase}</b>를 표시합니다.</p></div>
    <span class="badge mid">MATCH ONLY · ${phase}</span></div>
    <div class="report-metrics"><span>포메이션 <b>${esc(s.formation)}</b></span>
      <span>빌드업 <b>${esc(s.build_up_style)}</b></span><span>수비 <b>${esc(s.defensive_approach)}</b></span>
      <span>라인 높이 <b>${esc(s.line_height)}</b></span><span>전술 코드 <b>${esc(s.tactic_code||'미검증')}</b></span></div>
    <div class="grid2"><div><div class="tacpitch match-tacpitch">${players.map(p=>
      `<div class="tchip" style="left:${p.x}%;bottom:${Math.max(4,p.y*.92+4)}%"><b>${esc(p.label)}</b>
       <span>${esc(p.pos_label)}</span><small>${annotate(esc(p.role_name||p.role_id))}<br>${annotate(esc(p.focus))}${p.starter?'':`<br>${esc(p.minute_on)}분 투입`}</small></div>`).join('')}</div></div>
      <div class="scrollx"><table class="match-preset-table"><tr><th>위치</th><th>선수</th><th>구분</th><th>역할</th><th>포커스</th><th>경기 적합</th></tr>
      ${players.map(p=>`<tr><td><b>${esc(p.pos_label)}</b></td><td>${esc(p.label)}</td><td>${p.starter?'선발':`교체 ${esc(p.minute_on)}′`}</td><td>${annotate(esc(p.role_name||p.role_id))}<br><small>${esc(p.role_id)}</small></td>
        <td>${annotate(esc(p.focus))}</td><td>${present(p.fit_sim)?Number(p.fit_sim).toFixed(3):'—'}</td></tr>`).join('')}</table></div></div>
    ${subs.length?`<p class="dim">종료 XI 교체: ${subs.map(p=>`${esc(p.minute_on)}′ ${esc(all.find(x=>x.player_id===p.replaced_player_id)?.label||'—')} → <b>${esc(p.label)}</b>`).join(' · ')}</p>`:''}
    <details class="report-source"><summary>이 경기 설정의 근거·한계</summary><p>${esc(s.rationale)}</p>
      <p class="dim">${esc(s.source)}<br>${esc(s.confidence)}</p></details>`;
}
function render(r){
  document.getElementById('summary').innerHTML=`<div class="match-report-head"><div><h2>${esc(r.title)}</h2>
    <p class="kv">${esc(r.date||r.report_date)} · ${esc(r.competition)} · ${esc(r.stage||'')} · ${esc(r.venue)} ·
    결과 <b>${esc(r.result)}</b> · event <code>${esc(r.event_id)}</code></p></div><span class="badge hi">완료</span></div>
    <div class="report-metrics"><span>${annotate('점유율')} <b>${esc(r.possession ?? '미수집')}%</b></span>
    <span>슈팅 <b>${esc(r.shots_v ?? '—')}–${esc(r.shots_o ?? '—')}</b></span>
    <span>${annotate('유효슈팅')} <b>${esc(r.sot_v ?? '—')}–${esc(r.sot_o ?? '—')}</b></span>
    <span>${annotate('빅찬스')} <b>${esc(r.bigch_v ?? '—')}–${esc(r.bigch_o ?? '—')}</b></span></div>`;
  document.getElementById('teamStats').innerHTML=teamStatRows(r);
  renderGamePreset(r);
  document.getElementById('tactical').innerHTML=`
    <section><h3>전술 설명</h3><p>${annotate(esc(r.tactical_description))}</p></section>
    <section><h3>전술적 특성</h3><ul>${bullets(r.tactical_features)}</ul></section>
    <section><h3>경기 중 변화</h3><ol>${bullets(r.tactical_changes)}</ol></section>
    <section><h3>게임 구현 함의</h3><ul>${bullets(r.game_implications)}</ul></section>`;
  document.getElementById('players').innerHTML=r.players.slice().sort((a,b)=>(b.started||0)-(a.started||0)).map(p=>`<details class="player-report">
    <summary><span class="badge ${p.started?'hi':'mid'}">${p.started?'선발':'교체'}</span> <b>${esc(p.position)}</b> ${esc(p.label)} · ${annotate(esc(p.tactical_role))}
      <span class="dim">${esc(p.minutes ?? '—')}분 / ${esc(p.rating ?? '—')}</span></summary>
    <div class="player-report-body">${miniMap(p.map25)}<div>
      <p><b>특성</b> ${annotate(esc(p.characteristics))}</p><p><b>경기 평가</b> ${annotate(esc(p.performance))}</p>
      <p><b>FC 구현</b> ${annotate(esc(p.game_implication))}</p>${statsTable(p)}
      <p class="dim">${esc(p.source)} · ${esc(p.confidence)}</p></div></div></details>`).join('');
  document.getElementById('sourceMeta').innerHTML=`<p class="kv"><b>출처</b> ${esc(r.source)}<br>
    <b>신뢰도</b> ${esc(r.confidence)}<br><b>원문 경로</b> <code>${esc(r.report_path)}</code></p>`;
  document.getElementById('markdown').textContent=r.report_markdown || '원문 파일을 찾을 수 없습니다.';
  const keep=playerSel.value;
  const starters=r.players.filter(p=>p.started), subs=r.players.filter(p=>!p.started);
  playerSel.innerHTML='<option value="">선택 범위 합성</option>'+
    `<optgroup label="선발 11명">${starters.map(p=>`<option value="${p.player_id}">${esc(p.position)} · ${esc(p.label)}</option>`).join('')}</optgroup>`+
    (subs.length?`<optgroup label="교체 ${subs.length}명">${subs.map(p=>`<option value="${p.player_id}">${esc(p.position)} · ${esc(p.label)} (${esc(p.minutes)}분)</option>`).join('')}</optgroup>`:'');
  if ([...playerSel.options].some(o=>o.value===keep)) playerSel.value=keep;
  renderPitch(r);
}
function currentReport(){ return reports.find(r=>String(r.event_id)===reportSel.value) ?? reports[0]; }
if (!reports.length){
  reportSel.innerHTML='<option>리포트 없음</option>'; reportSel.disabled=true; playerSel.disabled=true;
  document.getElementById('empty').hidden=false;
} else {
  document.getElementById('report').hidden=false;
  reportSel.innerHTML=reports.map(r=>`<option value="${r.event_id}">${esc(r.date||r.report_date)} · ${esc(r.opponent)} · ${esc(r.result)}</option>`).join('');
  const requested=new URLSearchParams(location.search).get('event');
  if (requested && reports.some(r=>String(r.event_id)===requested)) reportSel.value=requested;
  const show=()=>{const r=currentReport();render(r);const u=new URL(location.href);u.searchParams.set('event',r.event_id);history.replaceState(null,'',u)};
  reportSel.addEventListener('change',()=>{playerSel.value='';show()});
  playerSel.addEventListener('change',()=>renderPitch(currentReport()));
  heatView.addEventListener('change',()=>{playerSel.value='';renderPitch(currentReport())});
  presetView.addEventListener('change',()=>renderGamePreset(currentReport()));
  show();
}
mountGlossaryTips();
</script></body></html>
