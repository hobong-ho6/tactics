<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>선수 분석 — tactics v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css"></head><body>
<div id="hdr"></div>
<h1>선수 분석 <small class="dim">실측 히트맵 · 경기 스탯 · 게임 스탯 · 영상 분석 파일럿</small></h1>
<div class="panel"><label class="kv">선수 <select id="who"></select></label> <span id="sf"></span></div>
<div class="cardrow" id="grids"></div>
<div class="panel"><h2>경기 스탯 (90분 환산 아님 — 경기당 평균)</h2><div id="pstat" class="kv"></div></div>
<div class="panel"><h2>FC26 게임 스탯</h2><div id="gstat" class="kv"></div></div>
<div class="panel"><h2>영상·스카우트 분석 (가설 → 실측 교차검증)</h2><table id="duty"></table></div>
<script type="module">
import { mountHeader, loadTeam, loadGameStats, sofifaLink } from './assets/data.js';
import { miniGrid } from './assets/pitch.js';
const { team } = await mountHeader('player.html');
const [td, GS] = await Promise.all([loadTeam(team), loadGameStats('FC26')]);
const strip = x => (x||'').normalize('NFC').replace(/\((합류확정|신규|보유)\)$/,'').replace(/^영입·/,'');
const names = [...new Set([
  ...td.squad.map(q=>strip(q.label)),
  ...td.prescriptions.filter(p=>p.kind.startsWith('measured')||p.starter).map(p=>strip(p.label)),
  ...td.duties.map(d=>strip(d.label)),
])].sort();
const who = document.getElementById('who');
who.innerHTML = names.map(n=>`<option>${n}</option>`).join('');
who.addEventListener('change', render);
const norm = x => (x||'').normalize('NFC').replace(/\((합류확정|신규|보유)\)$/,'');
function render(){
  const n = norm(who.value);
  if (!n) return;
  document.getElementById('sf').innerHTML = sofifaLink(n, GS);
  const pres = td.prescriptions.filter(p=>norm(p.label)===n&&p.map25&&p.kind.startsWith('measured'));
  document.getElementById('grids').innerHTML = (pres.length?pres:td.squad.filter(q=>q.label.includes(n)).map(q=>({kind:'measured(스쿼드)',map25:q.map25,sample_n:null,avg_rating:q.rate_v})))
    .map(p=>`<div class="pcard"><b>${p.kind}</b> <small class="dim">${p.pos_label??''}</small><br>${miniGrid(p.map25)}<br>
      <small class="dim">n=${p.sample_n??'—'} · 평점 ${p.avg_rating??'—'} · sim ${p.fit_sim??'—'}</small></div>`).join('') || '<span class="dim">실측 그리드 없음</span>';
  const st = td.player_stats.find(s=>norm(s.label)===n);
  document.getElementById('pstat').innerHTML = st ? `경기 <b>${st.n}</b> · 분 <b>${st.minutes??'—'}</b> · 평점 <b>${st.avg_rating??'—'}</b> · xG <b>${st.xg_pg??'—'}</b> · xA <b>${st.xa_pg??'—'}</b> · 키패스 <b>${st.kp_pg??'—'}</b> · 듀얼승 <b>${st.dw_pg??'—'}</b> · 태클 <b>${st.tk_pg??'—'}</b> · 인터셉트 <b>${st.ic_pg??'—'}</b>` : '<span class="dim">경기 스탯 없음 (match-watch 수집 대기)</span>';
  const g = GS[n];
  document.getElementById('gstat').innerHTML = g ? `OVR <b>${g.ovr}</b>/${g.pot} · ${g.positions??''} · 급성장 ${g.best_pos??''}<br>PAC ${g.pac} SHO ${g.sho} PAS ${g.pas} DRI ${g.dri} DEF ${g.def} PHY ${g.phy}<br><span class="dim">${(g.playstyles??'').split(';').join(' · ')}</span>` : '<span class="dim">FC26 로스터에 없음</span>';
  const ds = td.duties.filter(d=>norm(d.label)===n);
  document.getElementById('duty').innerHTML = ds.length ? '<tr><th>포지션</th><th>영상·스카우트 주장(가설)</th><th>실측 대조</th><th>판정</th><th>게임 함의</th></tr>'+
    ds.map(d=>`<tr><td><b>${d.position}</b></td><td>${d.duties}</td><td>${d.execution??''}</td><td>${d.adherence??''}</td><td class="dim">${d.game_role_implication??''}</td></tr>`).join('')
    : '<tr><td class="dim">파일럿 미수행 — 현재 만잠비·가르나초·고메스·시세 완료</td></tr>';
}
render();
</script></body></html>
