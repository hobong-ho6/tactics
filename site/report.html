<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>전술 리포트 — tactics v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<style>/* 감독 프로필 표 — 축·갱신(날짜) 열은 꺾지 않는다 */
#profile td:first-child,#profile td:last-child{white-space:nowrap}</style></head><body>
<div id="hdr"></div>
<h1 id="title"></h1>
<div class="panel"><h2>⭐ FC26 설정 시트 — 게임에 그대로 입력</h2>
  <div id="teamset" class="kv"></div><div id="pitch2"></div><table id="sheet"></table></div>
<div class="panel"><h2>전술 정본 — 인선 무관 <small class="dim">slot_canon_roles — 감독이 요구하는
  슬롯 임무의 게임 번역. 위 설정 시트(인선 프리셋)가 이와 다르면 편차다</small></h2>
  <div id="pitchCanon"></div><table id="canon"></table></div>
<div class="panel"><h2>감독 프로필 <small class="dim">manager_profiles — 11축</small></h2>
  <table id="profile"></table></div>

<p class="dim">서사·분석 전문은 docs/1x 감독 문서가 정본이다 — 이 페이지는 DB에 확정 기록된
결론(프로필 축·세팅)만 보여준다.</p>
<script type="module">
import { mountHeader, loadTeam, slotCandidates } from './assets/data.js?v=20260813-slot-candidates';
import { annotate, mountGlossaryTips } from './assets/glossary.js';

const { team, regime } = await mountHeader('report.html');
const td = await loadTeam(team);
document.getElementById('title').textContent =
  `${regime.manager_kr ?? regime.manager} · ${regime.team_kr}`;

// FC26 설정 시트 — 팀 세팅(setups 최신 projected/optimal) + 슬롯별 게임 처방(fc26:opt)
const su = td.setups.filter(x=>!/deprecated|reference/.test(x.kind) && /projected|optimal/.test(x.kind)).slice(-1)[0] ?? td.setups.slice(-1)[0];
document.getElementById('teamset').innerHTML = su ? `<b>${su.formation??''}</b> · 빌드업 <b>${su.build_up_style??'—'}</b> · 수비 <b>${su.defensive_approach??'—'}</b> · 라인 <b>${su.line_height??'—'}</b> · (${su.kind}, ${su.season})` : '팀 세팅 미기록';
const order = td.slots.map(s2=>s2.pos);
const geo = Object.fromEntries(td.slots.map(s2=>[s2.pos,s2]));
const rx = td.prescriptions.filter(p=>p.kind.startsWith('fc26:opt:'));
const all = order.flatMap(pos => slotCandidates(td, pos, { includeTransfers: false }).map(q => {
  const saved = rx.find(p => p.player_id===q.player_id && p.pos_label===pos);
  return {
    player_id:q.player_id, label:q.label, pos_label:pos,
    role_id:saved?.role_id ?? q.fit_role, focus:saved?.focus ?? q.fit_focus,
    starter:saved?.starter ?? 0
  };
}).filter(p => p.role_id && p.focus));
const byPos = Object.fromEntries(order.map(pos=>[pos, all.filter(p=>p.pos_label===pos)]));
const departedStarterPositions = new Set(rx.filter(p=>p.starter).map(p=>p.pos_label));
const chosen = Object.fromEntries(order.map(pos=>{
  const c = byPos[pos]; if(!c.length) return [pos,-1];
  const i = c.findIndex(p=>p.starter);
  // 확정 이탈한 기존 선발을 후보 필터가 제거한 경우, 다른 선수를 조용히 자동 승격하지 않는다.
  return [pos, i<0 && departedStarterPositions.has(pos) ? -1 : Math.max(0,i)];
}));
const canon = Object.fromEntries((td.slot_canon ?? [])
  .filter(c=>!su?.formation || c.formation===su.formation).map(c=>[c.pos,c]));
function drawSheet(){
  const opts = order.map(pos=>byPos[pos][chosen[pos]]).filter(Boolean);
  document.getElementById('pitch2').innerHTML =
   '<div class="tacpitch">' + opts.map(p=>{
     const g = geo[p.pos_label]; if(!g) return '';
     return `<div class="tchip" style="left:${g.x}%;bottom:${Math.max(4,g.y*0.92+4)}%">
       <b>${p.label}</b><span>${p.pos_label}</span><small>${p.role_id}<br>${p.focus}</small></div>`;
   }).join('') + '</div>';
  document.getElementById('sheet').innerHTML = '<tr><th>슬롯</th><th>선수 (교체 가능)</th><th>역할</th><th>포커스</th></tr>'+
   (all.length ? order.map(pos=>{
     const c = byPos[pos]; if(!c.length) return `<tr><td><b>${pos}</b></td><td colspan="3" class="dim">인선 공백</td></tr>`;
     const p = chosen[pos]>=0 ? c[chosen[pos]] : null;
     const sel = c.length>1 || !p ? `<select data-pos="${pos}">
       ${!p?'<option value="-1" selected>인선 공백 — 기존 선발 이탈</option>':''}
       ${c.map((q,i)=>`<option value="${i}" ${i===chosen[pos]?'selected':''}>${q.label}${q.starter?' ★':''}</option>`).join('')}</select>` : p.label;
     const cn = canon[pos];
     const dev = p && cn && (cn.role_id!==p.role_id || cn.focus!==p.focus)
       ? ` <small class="dim" title="정본 ${cn.role_id}/${cn.focus}와 다르다 — 인선 적합 우선">⚠ 정본과 편차</small>` : '';
     return `<tr><td><b>${pos}</b></td><td>${sel}</td><td>${p?p.role_id:'—'}${dev}</td><td>${p?p.focus:'—'}</td></tr>`;
   }).join('') : '<tr><td colspan="4" class="dim">게임 처방(fc26:opt) 미기록</td></tr>');
  document.querySelectorAll('#sheet select').forEach(el=>el.addEventListener('change',()=>{
    chosen[el.dataset.pos]=+el.value; drawSheet();
  }));
}
drawSheet();

// 전술 정본 — 인선 무관 (slot_canon_roles)
const cRows = order.map(pos=>canon[pos]).filter(Boolean);
document.getElementById('pitchCanon').innerHTML = cRows.length ?
  '<div class="tacpitch">' + cRows.map(c=>{
    const g = geo[c.pos]; if(!g) return '';
    return `<div class="tchip" style="left:${g.x}%;bottom:${Math.max(4,g.y*0.92+4)}%">
      <b>${c.pos}</b><small>${c.role_id}<br>${c.focus}</small></div>`;
  }).join('') + '</div>' : '';
document.getElementById('canon').innerHTML = '<tr><th>슬롯</th><th>역할</th><th>포커스</th><th>신뢰도</th><th>근거</th></tr>'+
  (cRows.length ? cRows.map(c=>
    `<tr><td><b>${c.pos}</b></td><td>${c.role_id}</td><td>${c.focus}</td>
     <td>${c.confidence ?? ''}</td><td class="dim">${annotate(c.rationale ?? '')}</td></tr>`).join('')
   : '<tr><td colspan="5" class="dim">이 체제의 정본 세트는 아직 기록되지 않았다 (slot_canon_roles — AVL만 확정, 2026-08-12)</td></tr>');
const AXES = { philosophy:'철학', traits:'전술적 특징', role_demands:'역할 요구',
  formation:'포메이션', situational:'상황별 변화', pressing:'압박·PPDA',
  buildup:'빌드업', rest_defense:'rest-defense', set_pieces:'세트피스',
  rotation:'로테이션', market:'이적 정책', implementation:'⭐ 게임 구현' };

document.getElementById('profile').innerHTML =
  `<tr><th>축</th><th>확정 결론</th><th>근거</th><th>갱신</th></tr>` +
  (td.profile.length ? td.profile.map(p => `<tr><td><b>${AXES[p.axis] ?? p.axis}</b></td>
     <td>${annotate(p.content)}</td><td class="dim">${annotate(p.evidence ?? '')}</td><td>${p.updated ?? ''}</td></tr>`).join('')
   : `<tr><td colspan="4" class="dim">아직 프로필 축이 기록되지 않았다 — docs 문서에서 이관 예정
      (manager_profiles 테이블에 INSERT 후 재익스포트)</td></tr>`);


mountGlossaryTips();
</script></body></html>
