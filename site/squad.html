<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>스쿼드 — tactics v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css"></head><body>
<div id="hdr"></div>
<h1>스쿼드 · 베스트 11 <small class="dim">슬롯별 실측 최적 인선 — 평점·적합 근거 병기 · 그리드=실측(경기 데이터), 게임 커널 히트맵은 히트맵 비교 B패널</small></h1>
<div class="panel"><label class="kv">슬롯 <select id="posSel"><option value="">전체</option></select></label></div>
<div class="panel"><table id="tbl"></table></div>
<p class="dim">적합(sim)은 커널 라이브 산출값. DB 저장값과 어긋나면 익스포트가 낡은 것 —
<span class="mono">python3 scripts/export.py</span>를 다시 돌릴 것.</p>
<script type="module">
import { mountHeader, loadTeam, loadKernels, loadGameStats, slotCandidates, sofifaLink, statLine, isGkSlot, gkPosCell } from './assets/data.js?v=20260816-gk-avgpos';
import { annotate, mountGlossaryTips } from './assets/glossary.js?v=20260902-safari-tooltip';
import { Kernel } from './assets/kernel.js?v=20260825-decodemap-null';
import { miniGrid } from './assets/pitch.js?v=20260825-decodemap-null';

const { team } = await mountHeader('squad.html');
const [td, kd, GS] = await Promise.all([loadTeam(team), loadKernels('FC26'), loadGameStats('FC26')]);
const K = new Kernel(kd);
const slots = td.slots.filter(s => s.formation === td.slots[0]?.formation);

/* 등번호 — player_shirt_numbers를 export가 slot_candidates에 실어 보낸다.
   ⚠️ NULL이면 표시하지 않는다(0으로 그리면 「0번」으로 오독된다). 갓 영입돼 FotMob 집계에
   아직 안 잡힌 선수가 있을 수 있어 결손이 정상 상태다. */
const shirt = q => q.shirt_number != null
  ? `<span class="shirtno" title="등번호 ${q.shirt_number}">${q.shirt_number}</span> ` : '';

const posSel=document.getElementById('posSel');
posSel.innerHTML='<option value="">전체</option>'+slots.map(s2=>`<option>${s2.pos}</option>`).join('');
posSel.addEventListener('change',build);
function build(){
const rows = [];
for (const s of slots){
  if (posSel.value && s.pos !== posSel.value) continue;
  const cs = slotCandidates(td, s.pos, { includeTransfers: false });
  if (!cs.length){ rows.push(`<tr><td>${s.pos}</td><td colspan="5" class="dim">실측 후보 없음 — 공백 슬롯</td></tr>`); continue; }
  // GK는 적합이 변별하지 못하므로(obs#220) 적합순 정렬이 의미 없다 — 평점순으로 세운다.
  // ⭐ 단 그 슬롯에 게임 처방 선발(fc26:opt starter=1)이 있으면 그 선수를 최상단에 둔다.
  //    처방은 사람 판단이 들어간 정본이고, 이걸 안 하면 리포트 설정시트와 ★가 어긋난다
  //    (2026-09-01 실제 발생 — AVL GK를 스즈키로 고정했는데 여기선 평점 1위 비조가 ★였다).
  const rx1 = (td.prescriptions ?? []).filter(p => p.kind === `fc26:opt:${s.pos}` && p.starter);
  const presStarter = rx1.length ? rx1[0].player_id : null;
  const ranked = cs.map(q => ({ q, bf: K.bestFit(q.map25, s.x, s.slot_type) }))
                   .sort((a, b) => isGkSlot(s.pos) ? (b.q.rating ?? 0) - (a.q.rating ?? 0)
                                                   : b.bf.sim - a.bf.sim)
                   .sort((a, b) => (b.q.player_id === presStarter) - (a.q.player_id === presStarter));
  ranked.forEach(({ q, bf }, i) => rows.push(`<tr>
    <td>${i === 0 ? `<b>${s.pos}</b>` : ''}</td>
    <td>${i === 0 ? '★ ' : ''}${shirt(q)}${q.label} ${sofifaLink(q.label, GS)}<br><small>${annotate(statLine(q.label, GS))}</small></td>
    <td>${gkPosCell(td, s.pos, q.player_id) ?? `${K.roleName[bf.role] ?? bf.role}/${bf.focus} <b>${bf.sim.toFixed(3)}</b>`}</td>
    <td>${q.rating ?? '—'} <small class="dim">${q.rate_note ?? ''}</small></td>
    <td>${miniGrid(q.map25, 60)}</td>
    <td class="dim">${isGkSlot(s.pos) ? '' : (q.fit_role ? `DB: ${q.fit_role}/${q.fit_focus} ${q.fit_sim ?? ''}` : '')}</td>
  </tr>`));
}
document.getElementById('tbl').innerHTML =
  `<tr><th>슬롯</th><th>선수</th><th>커널 적합(라이브)</th><th>평점</th><th>실측 그리드</th><th>DB 저장값</th></tr>`
  + rows.join('');
}
build();
mountGlossaryTips();
</script></body></html>
