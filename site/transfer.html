<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>이적 — tactics v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<style>/* 근거 확장 행 — 데이터 행과 한 덩어리로 읽히게 경계선을 잇고, 접힌 상태에서 높이를 최소화한다 */
tr.hasWhy>td{border-bottom:none}
tr.whyrow>td{padding-top:0}
tr.whyrow details.refs{min-width:0;max-width:none}
tr.whyrow .whylab{margin:8px 0 2px;font-size:12px;color:var(--acc);font-weight:700}
tr.whyrow .whylab:first-child{margin-top:4px}
tr.whyrow .srclist{margin:2px 0 0;padding-left:22px;font-size:12px;line-height:1.7}
tr.whyrow .srclist li{overflow-wrap:anywhere;margin-bottom:3px}
/* DEAD 행은 보관 기록이라는 것이 한눈에 보이게 낮춘다 — 값은 그대로 읽힌다 */
tr.deadrow>td{opacity:.62}
tr.deadrow>td:first-child{border-left:2px solid var(--bad);padding-left:6px}</style></head><body>
<div id="hdr"></div>
<h1>이적 감시 <small class="dim" id="win"></small></h1>
<div class="panel kv" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
  <button class="tab on" id="deadTgl"></button>
  <small class="dim">DEAD = 무산·강등·정체(STALE) 판정 건. 기본은 숨김 —
  툴의 후보 풀과 같은 기준이다. 펼치면 <b>왜 죽었는지</b>를 근거 행에서 확인할 수 있다.</small></div>
<div class="panel" id="summaryPanel" hidden><h2>이적창 종합 총평 <small class="dim">— 영상·매체 종합, 전술·선수 분석과 별개 축</small></h2><div id="summaryBody"></div></div>
<div class="panel"><h2>영입 후보</h2><table id="in"></table></div>
<div class="grid2">
  <div class="panel"><h2>유출 감시</h2><table id="out"></table></div>
  <div class="panel"><h2>수지 원장</h2><table id="ledger"></table></div>
</div>
<script type="module">
import { mountHeader, loadTeam, loadIndex, gkPosCell } from './assets/data.js?v=20260816-gk-avgpos';
import { miniGrid } from './assets/pitch.js?v=20260825-decodemap-null';
import { prose } from './assets/prose.js';

const { team, idx } = await mountHeader('transfer.html');
const td = await loadTeam(team);
document.getElementById('win').textContent = idx.window;

const badge = lh => !lh ? '' : /^DEAD/i.test(lh) ? `<span class="badge dead">DEAD</span>`
  : /^CONFIRMED/.test(lh) ? '<span class="badge hi">확정</span>'
  : /^HIGH/.test(lh) ? `<span class="badge hi">${lh.split(' ')[0]}</span>`
  : `<span class="badge mid">${lh.split(' ')[0]}</span>`;

const T = td.transfer;
const isDead = x => /^DEAD/i.test(x.likelihood || '');
/* DEAD 기본 숨김 — 툴의 injectTransferCandidates()가 /^DEAD/i를 건너뛰는 것과 같은 기준이다.
   다만 「왜 죽었나」의 근거가 오히려 가장 두꺼운 경우가 많아(무산 경위·반증 티어) 토글로 연다. */
let showDead = false;
const visible = rows => showDead ? rows : rows.filter(x => !isDead(x));
/* 근거 행 — rationale은 최대 5천자대라 셀에 넣으면 표가 무너진다. 데이터 행 바로 아래에
   colspan 행으로 붙여 접어 두고, 펼치면 표 폭 전체를 쓴다(prose로 마커·열거를 끊어 읽는다).
   데이터 행의 아래 경계선을 없애 두 행이 한 덩어리로 읽히게 한다. */
const FIELDS = [['근거', 'rationale'], ['신뢰도·한계', 'confidence']];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* source는 마커가 없어 prose로 넣으면 1블록에 뭉친다 — ' ; ' 구분 목록이므로 번호 리스트로 쪼개고
   URL은 새 탭 링크로 만든다(player.html의 references()와 같은 취급). */
function srcList(src){
  const items = String(src ?? '').split(/\s*;\s*/).map(s => s.trim()).filter(Boolean);
  if (!items.length) return '';
  const link = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  const linked = items.filter(s => /https?:\/\//.test(s)).length;
  return `<div class="whylab">출처 ${items.length}건 <small class="dim">· 직접 링크 ${linked}건</small></div>
    <ol class="srclist">${items.map(s => `<li>${link(s)}</li>`).join('')}</ol>`;
}
function whyRow(x, cols){
  const parts = FIELDS.filter(([, k]) => (x[k] ?? '').trim())
    .map(([lab, k]) => `<div class="whylab">${lab}</div>${prose(x[k])}`);
  if ((x.source ?? '').trim()) parts.push(srcList(x.source));
  if (!parts.length) return '';
  return `<tr class="whyrow"><td colspan="${cols}"><details class="refs">
    <summary>근거 · 신뢰도 · 출처 보기</summary>${parts.join('')}</details></td></tr>`;
}
function drawIn(){
 document.getElementById('in').innerHTML =
  `<tr><th>선수</th><th>슬롯</th><th>등급</th><th>최신 보도</th><th>적합</th><th>표본</th><th>그리드</th></tr>` +
  (visible(T.targets).map(t => `<tr class="${(t.rationale??'').trim()?'hasWhy':''} ${isDead(t)?'deadrow':''}"><td><b>${t.name_kr ?? t.name}</b> <small class="dim">${t.club ?? ''}</small></td>
    <td>${t.slot}</td><td>${badge(t.likelihood)}</td><td>${t.last_news_date ?? '—'}</td>
    <td>${gkPosCell(td, t.slot, t.player_id, t.tool_y != null ? { x: t.tool_x, y: t.tool_y, n: t.sample_n } : null)
          ?? (t.fit_role ? `${t.fit_role}/${t.fit_focus} <b>${t.fit_sim}</b>` : '—')}</td>
    <td>${t.sample_n ?? '—'}경기 ${t.avg_rating ?? ''}</td>
    <td>${t.map25 ? miniGrid(t.map25, 50) : '<small class="dim">PENDING</small>'}</td></tr>`
    + whyRow(t, 7)).join('')
   || '<tr><td colspan="7" class="dim">이 팀의 이적 감시 데이터 없음</td></tr>');
}

function drawOut(){
 document.getElementById('out').innerHTML =
  `<tr><th>선수</th><th>행선</th><th>등급</th><th>최신</th></tr>` +
  (visible(T.outgoing).map(o => `<tr class="${(o.rationale??'').trim()?'hasWhy':''} ${isDead(o)?'deadrow':''}"><td>${o.name_kr ?? o.name}</td><td>${o.dest_club}</td>
    <td>${badge(o.likelihood)}</td><td>${o.last_news_date ?? '—'}</td></tr>`
    + whyRow(o, 4)).join('')
   || '<tr><td colspan="4" class="dim">없음</td></tr>');
}

if (T.summary) {
  document.getElementById('summaryPanel').hidden = false;
  document.getElementById('summaryBody').innerHTML = prose(T.summary.summary)
    + `<details style="margin-top:8px"><summary class="dim">출처·한계</summary>
       <div class="kv" style="font-size:12.5px;margin-top:6px">
         <b>출처</b>${prose(T.summary.source)}<b>한계</b>${prose(T.summary.confidence)}
         <b>갱신</b> ${T.summary.updated}</div></details>`;
}

{
  const nDead = [...T.targets, ...T.outgoing].filter(isDead).length;
  const btn = document.getElementById('deadTgl');
  const paint = () => {
    btn.textContent = showDead ? `DEAD 포함 (${nDead}건 표시 중)` : `DEAD ${nDead}건 숨김 — 보기`;
    btn.classList.toggle('on', !showDead);
    drawIn(); drawOut();
  };
  btn.addEventListener('click', () => { showDead = !showDead; paint(); });
  paint();
}

/* 통화는 £m이다(Sky 표기값). 이전 헤더가 €m으로 잘못 적혀 있었다 — 2026-08-16 정정.
   미공개(undisclosed) 건은 0으로 합산하면 순수지를 왜곡하므로 합계에서 빼고 건수만 센다.

   ⭐ 2026-08-20 — 지출·수입을 절로 분리하고 영입에 「상각 기준」을 넣었다. 이유:
   구단 장부에 잡히는 것은 이적료 전액이 아니라 **연 상각액 = 이적료 ÷ 계약연수**다.
   PL은 2023-12 주주총회 의결로 그 상각 기간을 **5년으로 상한**했다(UEFA 2023-06과 정합).
   따라서 계약이 7~8년이어도 분모는 5다 — 첼시의 장기계약 분산 기법을 무력화한 그 규정이다.
   ⚠️ 매각은 상각하지 않는다 — 매각은 처분이익(이적료 − 잔존 장부가)으로 **즉시** 인식된다.
   그래서 두 축을 한 숫자로 상계하면 회계적으로 틀린다. 순현금은 참고용으로만 남긴다. */
{
  const AMORT_CAP = 5;                                   // PL·UEFA 상각 상한(년)
  const undisc = l => (l.note ?? '').startsWith('미공개');
  const num = l => undisc(l) ? null : Number(l.amount_m);
  const rows = k => T.ledger.filter(l => l.kind === k);
  const sum = k => rows(k).reduce((a, l) => a + (num(l) ?? 0), 0);
  /* 연 상각액 — 계약연수가 확인된 건만. 미확인은 추정하지 않고 건수만 센다(§2 보존 정책과 같은 태도). */
  const amort = l => {
    const fee = num(l), y = Number(l.contract_years);
    return (fee && y) ? fee / Math.min(y, AMORT_CAP) : null;
  };
  const spend = sum('영입 지출'), earn = sum('매각 수입');
  const ins = rows('영입 지출'), outs = rows('매각 수입');
  const amortSum = ins.reduce((a, l) => a + (amort(l) ?? 0), 0);
  /* 상각 커버리지는 **이적료가 있는 행**만 분모로 센다 — 미공개·자유이적(0)까지 세면
     「확인 N건」이 실제보다 커져 결손이 감춰진다. */
  const feeRows = ins.filter(l => num(l));
  const noYears = feeRows.filter(l => !Number(l.contract_years));
  const withYears = feeRows.filter(l => Number(l.contract_years));
  const feeKnown = withYears.reduce((a, l) => a + num(l), 0);
  const undis = T.ledger.filter(undisc).length;
  const net = earn - spend;
  const f1 = v => v.toFixed(1);

  const inRow = l => {
    const a = amort(l);
    return `<tr><td>${l.label}</td>
      <td>${undisc(l) ? '<small class="dim">미공개</small>' : f1(Number(l.amount_m))}</td>
      <td>${l.contract_years ? `${l.contract_years}년${l.contract_years > AMORT_CAP
            ? ' <small class="dim">→5</small>' : ''}` : '<small class="dim">미확인</small>'}</td>
      <td>${a != null ? `<b>${f1(a)}</b>` : '<small class="dim">—</small>'}</td></tr>`;
  };
  const outRow = l => `<tr><td>${l.label}</td>
      <td>${undisc(l) ? '<small class="dim">미공개</small>' : f1(Number(l.amount_m))}</td>
      <td colspan="2" class="dim">${l.note ?? ''}</td></tr>`;

  document.getElementById('ledger').innerHTML = T.ledger.length ? `
    <tr><th colspan="4">영입 — 지출 <small class="dim">(£m)</small></th></tr>
    <tr><th>항목</th><th>이적료</th><th>계약</th><th>연 상각액</th></tr>
    ${ins.map(inRow).join('') || '<tr><td colspan="4" class="dim">없음</td></tr>'}
    <tr><th>소계</th><th>${f1(spend)}</th>
      <th class="dim">계약 확인 ${withYears.length}/${feeRows.length}건</th>
      <th class="dead">${f1(amortSum)}/년</th></tr>

    <tr><th colspan="4" style="padding-top:14px">매각 — 수입 <small class="dim">(£m · 상각 없음)</small></th></tr>
    <tr><th>항목</th><th>금액</th><th colspan="2">비고</th></tr>
    ${outs.map(outRow).join('') || '<tr><td colspan="4" class="dim">없음</td></tr>'}
    <tr><th>소계</th><th class="hi">${f1(earn)}</th><th colspan="2" class="dim">처분이익은 즉시 인식</th></tr>

    <tr><th colspan="4" style="padding-top:14px">이번 창이 만든 연간 비용</th></tr>
    <tr><td>영입 연 상각 부담</td><th class="dead">+${f1(amortSum)}/년</th>
      <td colspan="2" class="dim">이적료 £${f1(feeKnown)}m을 계약연수(최대 ${AMORT_CAP}년)로 나눈 값</td></tr>
    <tr><td>순현금 <small class="dim">(참고)</small></td>
      <th class="${net >= 0 ? 'hi' : 'dead'}">${net >= 0 ? '+' : ''}${f1(net)}</th>
      <td colspan="2" class="dim">현금 이동 기준 — 회계 손익이 아닙니다</td></tr>
    <tr><td colspan="4" class="dim">
      ⭐ <b>연 상각액 = 이적료 ÷ 계약연수</b>이고, PL은 <b>2023-12 의결로 상각 기간을 ${AMORT_CAP}년으로 상한</b>했습니다
      (UEFA 2023-06과 정합). 계약이 ${AMORT_CAP}년보다 길면 <small class="dim">→5</small>로 표시하고 분모를 5로 씁니다 —
      첼시의 장기계약 분산 기법을 무력화한 그 규정입니다.<br>
      ⚠️ <b>매각은 상각하지 않습니다</b> — 처분이익(이적료 − 잔존 장부가)으로 즉시 인식되므로 상각과 상계할 수 없습니다.
      잔존 장부가를 우리가 갖고 있지 않아 <b>처분이익은 산출하지 않았습니다</b>(표시값은 이적료입니다).<br>
      ⚠️ 계약연수 <b>미확인 ${noYears.length}건</b>은 추정하지 않고 상각 소계에서 제외했습니다 — 실제 부담은 이보다 큽니다.<br>
      ⚠️ 진행 중 루머를 제외한 <b>공식 발표 완료 건</b>만이며, 금액은 Sky 표기값이고 <b>급여·대리인 수수료·임대료는 빠져
      있습니다</b>. 일부 행은 애드온이 포함된 총액이라 상각 분모에 넣을 <b>보장 이적료와 다를 수 있습니다</b>.
      미공개 ${undis}건은 합계에서 제외했습니다.<br>
      ⛔ <b>「가용 금액」의 절대치는 산출하지 않았습니다.</b> 26/27부터 PSR을 대체하는 <b>SCR</b>은
      (임금+상각+대리인수수료) ÷ (축구수익+선수매각 순손익) ≤ <b>85%</b>를 보는 <b>비율 규제</b>이고,
      우리 DB에 <b>축구수익·임금 총액이 없습니다</b>. 위 「연 상각 부담」은 그 분자의 증가분입니다.
    </td></tr>` : '<tr><td colspan="4" class="dim">없음</td></tr>';
}
</script></body></html>
